spring.application.name=tripwise-backend

# Render supplies PORT; the fallback supports local development.
server.port=${PORT:8080}

# PostgreSQL connection; Render provides these values through render.yaml.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tripwise}?sslmode=${DB_SSLMODE:disable}}
spring.datasource.username=${DB_USERNAME:tripwise}
spring.datasource.password=${DB_PASSWORD:tripwise}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Create JPA tables before applying the seed script.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
