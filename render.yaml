databases:
  - name: tripwise-db
    plan: free
    databaseName: tripwise
    user: tripwise

services:
  - type: web
    name: tripwise-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/destinations
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: tripwise-db
          property: host
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        fromDatabase:
          name: tripwise-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tripwise-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tripwise-db
          property: password
      - key: DB_SSLMODE
        value: require
